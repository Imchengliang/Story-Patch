name: canonguard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: canonguard
      POSTGRES_PASSWORD: canonguard
      POSTGRES_DB: canonguard
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canonguard -d canonguard"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/canonguard
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - neo4jdata:/data
      - ./neo4j/constraints.cypher:/import/constraints.cypher:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p canonguard 'RETURN 1' >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: canonguard
      MINIO_ROOT_PASSWORD: canonguard
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  neo4jdata:
  miniodata:
  valkeydata:
